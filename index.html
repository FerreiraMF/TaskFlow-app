<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>TaskFlow</title>
  </head>
  <body>
    <div class="task">
      <h1>TaskFlow</h1>
      <input
        type="text"
        id="input-task"
        placeholder="Digite sua próxima tarefa..."
      />
      <button id="add-task">Adicionar tarefa</button>
    </div>
    <div class="filter-task">
      <button id="all-task" type="button">Todos</button>
      <button id="pending-task" type="button">Pendentes</button>
      <button id="completed-task" type="button">Concluídas</button>
    </div>
    <div class="task-list"></div>

    <script src="script.js"></script>
  </body>
</html>
